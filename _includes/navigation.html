<div class="navigation">
    {% if page.previous %}
        <a class="prev" href="{{ site.baseurl }}{{ page.previous.url }}">← {{ page.previous.date | date: "%Y" }} {{ page.previous.title }}</a>
    {% else %}
        <span class="prev"></span>
    {% endif %}
    {% if page.next %}
        <a class="next" href="{{ site.baseurl }}{{ page.next.url }}">{{ page.next.date | date: "%Y" }} {{ page.next.title }} →</a>
    {% else %}
        <span class="next"></span>
    {% endif %}
</div>
