<div class="navigation">
    {% if page.previous %}
        <a class="prev" href="{{ site.baseurl }}{{ page.previous.url }}">← {{ page.previous.quarter }}</a>
    {% else %}
        <span class="prev"></span>
    {% endif %}
    {% if page.next %}
        <a class="next" href="{{ site.baseurl }}{{ page.next.url }}">{{ page.next.quarter }} →</a>
    {% else %}
        <span class="next"></span>
    {% endif %}
</div>
